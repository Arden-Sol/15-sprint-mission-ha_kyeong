<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
    <title>판다 마켓</title>
    <script
      src="https://kit.fontawesome.com/f52b457031.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header>
      <div class="inner1">
        <div class="logo">
          <a href="/">
            <img class="logo" src="images/logo.png" alt="판다마켓 대표로고" />
          </a>
        </div>
        <button class="login btn"><a href="./login.html">로그인</a></button>
      </div>
    </header>
    <main>
      <section class="main-visual">
        <div class="inner2">
          <div class="main-title">
            <h2>
              일상의 모든 물건을
              <br />
              거래해 보세요
            </h2>
            <button class="search btn">
              <a href="./items.html">구경하러 가기</a>
            </button>
          </div>
          <img
            class="main-visual-img"
            src="images/img_home_top.png"
            alt="visual main image"
          />
        </div>
      </section>
      <section>
        <div class="inner3">
          <img src="images/img_home_01.png" alt="인기 상품을 확인해 보세요" />
          <div class="content">
            <p class="hot-item">Hot item</p>
            <h2>
              인기 상품을
              <br />
              확인해 보세요
            </h2>
            <p>
              가장 HOT한 중고거래 물품을
              <br />
              판다 마켓에서 확인해 보세요
            </p>
          </div>
        </div>
      </section>

      <section>
        <div class="inner3">
          <img src="images/img_home_02.png" alt="상품을 검색하세요" />
          <div class="content">
            <p class="hot-item">Hot item</p>
            <h2>
              구매를 원하는
              <br />
              상품을 검색하세요
            </h2>
            <p>
              구매하고 싶은 물품은 검색에서
              <br />
              쉽게 찾아보세요
            </p>
          </div>
        </div>
      </section>

      <section>
        <div class="inner3">
          <img src="images/img_home_03.png" alt="상품을 등록하세요" />
          <div class="content">
            <p class="hot-item">Hot item</p>
            <h2>
              판매를 원하는
              <br />
              상품을 등록하세요
            </h2>
            <p>
              어떤 물건이든 판매하고 싶은 상품을
              <br />
              쉽게 등록하세요
            </p>
          </div>
        </div>
      </section>

      <section class="bottom">
        <div class="inner2">
          <h2>
            믿을 수 있는
            <br />
            판다마켓 중고 거래
          </h2>
          <img
            src="images/img_home_bottom.png"
            alt="믿을 수 있는 판다마켓 중고 거래"
          />
        </div>
      </section>
    </main>

    <footer>
      <div class="inner1">
        <p>codeit - 2024</p>
        <div>
          <a href="#"><a href="./privacy.html">Privacy Policy</a></a>
          <a href="#"><a href="./faq.html">FAQ</a></a>
        </div>
        <ul>
          <li>
            <a href="https://www.facebook.com/?locale=ko_KR" target="_blank">
              <i class="fa-brands fa-facebook"></i>
            </a>
          </li>
          <li>
            <a href="https://x.com/home?lang=ko" target="_blank">
              <i class="fa-brands fa-twitter"></i>
            </a>
          </li>
          <li>
            <a href="https://www.youtube.com/" target="_blank">
              <i class="fa-brands fa-youtube"></i>
            </a>
          </li>
          <li>
            <a href="https://www.instagram.com/" target="_blank">
              <i class="fa-brands fa-instagram"></i>
            </a>
          </li>
        </ul>
      </div>
    </footer>
  </body>
</html>
