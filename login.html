<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <main>
      <div class="logo">
        <a href="/">
          <img src="images/login_images/logo.png" alt="판다마켓 로고" />
        </a>
      </div>
      <form action="">
        <label for="email">이메일</label>
        <input id="email" type="email" placeholder="이메일을 입력해주세요" />
        <label for="password">비밀번호</label>
        <div class="password-wrapper">
          <input
            id="password"
            type="password"
            placeholder="비밀번호를 입력해주세요"
          />
          <button type="button" class="toggle-password">
            <img src="images/login_images/eye_close.png" alt="눈 아이콘" />
          </button>
        </div>
        <button type="submit">로그인</button>
      </form>
      <div class="simple-login">
        <p>간편 로그인하기</p>
        <div class="icons">
          <a
            href="https://www.google.com/"
            target="_blank"
            title="구글 페이지로 이동"
          >
            <img
              src="images/login_images/google_icon.png"
              alt="구글 간편 로그인"
            />
          </a>
          <a
            href="https://www.kakaocorp.com/"
            target="_blank"
            title="카카오톡 페이지로 이동"
          >
            <img
              src="images/login_images/kakao_talk_icon.png"
              alt="카카오톡 간편 로그인"
            />
          </a>
        </div>
      </div>
      <div class="sign-up">
        <p>판다마켓이 처음이신가요?</p>
        <a href="./signup.html" title="회원가입 화면으로 이동">회원가입</a>
      </div>
    </main>
  </body>
</html>
