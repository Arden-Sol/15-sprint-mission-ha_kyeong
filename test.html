<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./js/main.js" type="module" defer></script>
  </head>
  <body>
    <button id="reset">초기화</button>
    <div class="productContainer">
      <h1>상품관련 API</h1>
      <div>수정할 때는 아이디 칸도 채워주세요</div>
      <p>
        상품 리스트 가져오기:
        <button id="productList">product list</button>
      </p>

      <label for="productIdInput">Product Id</label>
      <input type="text" id="productIdInput" />
      <button type="submit" id="productGet">조회</button>
      <button type="submit" id="productDelete">삭제</button>

      <form action="#" id="productForm">
        <label for="productName">Product name</label>
        <input name="name" type="text" id="productName" />

        <label for="productDescription">Product description</label>
        <input name="description" type="text" id="productDescription" />

        <label for="productPrice">Product price</label>
        <input name="price" type="text" id="productPrice" />

        <label for="productImage">Product image</label>
        <input name="images" type="text" id="productImage" />

        <label for="productTag">Product tag</label>
        <input name="tags" type="text" id="productTag" />

        <button type="submit" id="productCreate">생성</button>
        <button type="submit" id="productPatch">수정</button>
      </form>
    </div>

    <div class="articleContainer">
      <h1>아티클 관련 API</h1>
      <div>수정할 때는 아이디 칸도 채워주세요</div>
      <p>
        아티클 리스트 가져오기:
        <button id="articleList">article list</button>
      </p>

      <label for="articleIdInput">article Id</label>
      <input type="text" id="articleIdInput" />
      <button type="submit" id="articleGet">조회</button>
      <button type="submit" id="articleDelete">삭제</button>

      <form action="#" id="articleForm">
        <label for="articleTitle">article title</label>
        <input name="title" type="text" id="articleTitle" />

        <label for="articleContent">article content</label>
        <input name="content" type="text" id="articleContent" />

        <label for="articleImage">article image</label>
        <input name="image" type="text" id="articleImage" />

        <button type="submit" id="articleCreate">생성</button>
        <button type="submit" id="articlePatch">수정</button>
      </form>
    </div>

    <pre id="result"></pre>
  </body>
</html>
